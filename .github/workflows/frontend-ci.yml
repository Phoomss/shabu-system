name: Frontend CI
on:
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend-ci.yml"]
  push:
    branches: [main, develop, "feature/**"]
    paths: ["frontend/**", ".github/workflows/frontend-ci.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint
      - name: All client regression tests
        id: unit
        continue-on-error: true
        run: npm test
      - run: npm run build
      - name: Enforce every quality gate
        if: always()
        env:
          LINT: ${{ steps.lint.outcome }}
          UNIT: ${{ steps.unit.outcome }}
        run: test "$LINT" = success && test "$UNIT" = success
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: shabu-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
