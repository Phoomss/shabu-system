name: Backend CI
on:
  pull_request:
    paths:
      [
        "backend/**",
        "scripts/**",
        "docker-compose.yml",
        ".github/workflows/backend-ci.yml",
      ]
  push:
    branches: [main, develop, "feature/**"]
    paths:
      [
        "backend/**",
        "scripts/**",
        "docker-compose.yml",
        ".github/workflows/backend-ci.yml",
      ]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - name: Lint (read only)
        id: lint
        continue-on-error: true
        run: npm run lint
      - name: Security, workflow, IDs, payment, inventory regressions
        id: regressions
        continue-on-error: true
        run: npm run test:regression
      - name: Full unit suite (includes existing scaffold failures)
        id: unit
        continue-on-error: true
        run: npm test -- --runInBand
      - run: npm run build
      - name: Verify artifact
        run: test -f dist/main.js
      - name: Enforce every quality gate
        if: always()
        env:
          LINT: ${{ steps.lint.outcome }}
          REGRESSIONS: ${{ steps.regressions.outcome }}
          UNIT: ${{ steps.unit.outcome }}
        run: test "$LINT" = success && test "$REGRESSIONS" = success && test "$UNIT" = success
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: shabu-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
